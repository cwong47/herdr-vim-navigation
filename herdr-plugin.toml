id = "herdr-vim-navigation"
name = "Vim Navigation"
version = "0.5.0"
min_herdr_version = "0.9.0"
description = "Vim- and Screen-style navigation for herdr: ^W H/J/K/L pane moves, ^W T pane to new tab, pane to new space, join pane into another tab, ^W = equalize, last-space toggle, first/last space and space reordering."
platforms = ["linux", "macos"]

# Records the last space you were in, for the last-space action.
[[startup]]
command = ["python3", "scripts/lastspace.py", "watch"]

# ── Popups ───────────────────────────────────────────────────────────────────
# Titles are padded with U+2800 (braille blank): herdr trims spaces, and the
# padding matches the gap around built-in popup titles like help.

[[panes]]
id = "space-mover-up"
title = "⠀Move space⠀"
placement = "popup"
width = 60
height = 5
command = ["python3", "scripts/movespace.py", "up", "--interactive"]

[[panes]]
id = "space-mover-down"
title = "⠀Move space⠀"
placement = "popup"
width = 60
height = 5
command = ["python3", "scripts/movespace.py", "down", "--interactive"]

[[panes]]
id = "join-picker"
title = "⠀Move pane to tab⠀"
placement = "popup"
width = 90
height = 20
command = ["python3", "scripts/join.py", "--interactive"]

# ── Panes ────────────────────────────────────────────────────────────────────

[[actions]]
id = "equalize"
title = "Equalize panes"
description = "Equalize pane sizes in the focused tab (Vim ^W =)."
command = ["python3", "scripts/equalize.py"]

[[actions]]
id = "move-left"
title = "Move pane to left edge"
description = "Move the focused pane to the full-height left edge (Vim ^W H)."
command = ["python3", "scripts/move.py", "h"]

[[actions]]
id = "move-down"
title = "Move pane to bottom edge"
description = "Move the focused pane to the full-width bottom edge (Vim ^W J)."
command = ["python3", "scripts/move.py", "j"]

[[actions]]
id = "move-up"
title = "Move pane to top edge"
description = "Move the focused pane to the full-width top edge (Vim ^W K)."
command = ["python3", "scripts/move.py", "k"]

[[actions]]
id = "move-right"
title = "Move pane to right edge"
description = "Move the focused pane to the full-height right edge (Vim ^W L)."
command = ["python3", "scripts/move.py", "l"]

[[actions]]
id = "break-tab"
title = "Move pane to new tab"
description = "Move the focused pane into a new tab of its own (Vim ^W T, tmux prefix !)."
command = ["python3", "scripts/break.py", "tab"]

[[actions]]
id = "break-space"
title = "Move pane to new space"
description = "Move the focused pane into a new space of its own."
command = ["python3", "scripts/break.py", "space"]

[[actions]]
id = "join"
title = "Move pane into another tab"
description = "Pick a pane in another tab and split the focused pane next to it (tmux join-pane)."
command = ["python3", "scripts/join.py"]

[[actions]]
id = "only"
title = "Close other panes"
description = "Close every pane in the focused tab except the focused one (Vim ^W o, Screen ^A q)."
command = ["python3", "scripts/only.py", "pane"]

[[actions]]
id = "only-tab"
title = "Close other tabs"
description = "Close every tab in the focused space except the focused one (Vim :tabonly)."
command = ["python3", "scripts/only.py", "tab"]

# ── Spaces ───────────────────────────────────────────────────────────────────

[[actions]]
id = "last-space"
title = "Previous space (toggle)"
description = "Jump back to the space you were in before (Screen ^A ^A, cd -)."
command = ["python3", "scripts/lastspace.py", "toggle"]

[[actions]]
id = "space-up"
title = "Move space up"
description = "Move the focused space up in the sidebar; keep pressing ^K/^J in the popup."
command = ["python3", "scripts/popup.py", "space-mover-up"]

[[actions]]
id = "space-down"
title = "Move space down"
description = "Move the focused space down in the sidebar; keep pressing ^K/^J in the popup."
command = ["python3", "scripts/popup.py", "space-mover-down"]

[[actions]]
id = "space-first"
title = "First space"
description = "Focus the first (top) space in the sidebar."
command = ["python3", "scripts/focusspace.py", "first"]

[[actions]]
id = "space-last"
title = "Last space"
description = "Focus the last (bottom) space in the sidebar."
command = ["python3", "scripts/focusspace.py", "last"]
